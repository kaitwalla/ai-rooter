name: Patch scoped auth integration
on:
  push:
    branches: [agent/scoped-api-keys]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patchbot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scoped-api-keys
      - name: Patch router and test harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.go')
          s=p.read_text()
          s=s.replace('func NewApp(store *Store, adminTokenEnv string) *App {\n\treturn &App{', 'func NewApp(store *Store, adminTokenEnv string) *App {\n\tstore.EnableScopedAuthBridge()\n\treturn &App{', 1)
          s=s.replace('\treturn logRequests(mux)\n}', '\treturn a.scopedAuthMiddleware(logRequests(mux))\n}', 1)
          p.write_text(s)

          p=Path('app_test.go')
          s=p.read_text()
          s=s.replace('func authorizeAdmin(req *http.Request, app *App) {\n\treq.Header.Set("Authorization", "Bearer "+app.adminToken())\n}', 'func authorizeAdmin(req *http.Request, app *App) {\n\treq.Header.Set("Authorization", "Bearer test-admin-key")\n}', 1)
          marker='func testApp(t *testing.T, cfg Config) *App {\n\tt.Helper()\n'
          s=s.replace(marker, marker+'\tif strings.TrimSpace(cfg.AdminToken) == "" { cfg.AdminToken = "test-admin-key" }\n', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "rooter-patchbot"
          git config user.email "actions@users.noreply.github.com"
          git add app.go app_test.go
          git commit -m "[patchbot] Integrate scoped auth into router" || exit 0
          git push origin HEAD:agent/scoped-api-keys
