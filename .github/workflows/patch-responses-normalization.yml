name: Patch Responses normalization

on:
  push:
    branches:
      - agent/responses-embeddings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize translated Chat request
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('responses_compat.go')
          s = p.read_text()
          old = '''\tchatBody, stream, err := responsesRequestToChat(original)\n\tif err != nil {\n\t\treturn jsonTransportError(req, http.StatusBadRequest, "invalid_request_error", err.Error()), nil\n\t}\n\n\tclone := req.Clone(req.Context())\n'''
          new = '''\tchatBody, stream, err := responsesRequestToChat(original)\n\tif err != nil {\n\t\treturn jsonTransportError(req, http.StatusBadRequest, "invalid_request_error", err.Error()), nil\n\t}\n\tchatBody, err = normalizeProviderChatRequest(req.URL.Hostname(), chatBody)\n\tif err != nil {\n\t\treturn jsonTransportError(req, http.StatusBadRequest, "invalid_request_error", err.Error()), nil\n\t}\n\n\tclone := req.Clone(req.Context())\n'''
          if new not in s:
              if old not in s:
                  raise SystemExit('responses translation anchor not found')
              p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add responses_compat.go
          git commit -m 'normalize translated Responses chat requests'
          git push
