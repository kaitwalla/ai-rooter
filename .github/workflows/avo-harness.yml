name: AVO Harness

on:
  push:
    paths:
      - "avo-harness/**"
      - ".github/workflows/avo-harness.yml"
  pull_request:
    paths:
      - "avo-harness/**"
      - ".github/workflows/avo-harness.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avo-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: avo-harness/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
