name: Patch scoped bridge cleanup
on:
  push:
    branches:
      - agent/scoped-api-keys
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scoped-api-keys
      - name: Patch internal compatibility checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.go')
          s = p.read_text()
          s = s.replace('''func (a *App) adminToken() string {
	if a.adminTokenEnv != "" {
		return a.adminTokenEnv
	}
	return a.store.Snapshot().AdminToken
}''','''func (a *App) adminToken() string {
	if a.adminTokenEnv != "" {
		return a.adminTokenEnv
	}
	if a.store.ScopedAuthBridgeEnabled() {
		return internalAdminAuthSentinel
	}
	return a.store.Snapshot().AdminToken
}''')
          s = s.replace('''func (a *App) requirePublicAPIKey(w http.ResponseWriter, r *http.Request) bool {
	cfg := a.store.Snapshot()
	if len(cfg.PublicAPIKeys) == 0 {
		writeOpenAIError(w, http.StatusUnauthorized, "invalid_api_key", "no public API keys are configured")
		return false
	}
	token := bearerToken(r.Header.Get("Authorization"))
	if slices.Contains(cfg.PublicAPIKeys, token) {
		return true
	}''','''func (a *App) requirePublicAPIKey(w http.ResponseWriter, r *http.Request) bool {
	token := bearerToken(r.Header.Get("Authorization"))
	if a.store.ScopedAuthBridgeEnabled() && token == internalPublicAuthSentinel {
		return true
	}
	cfg := a.store.Snapshot()
	if len(cfg.PublicAPIKeys) == 0 {
		writeOpenAIError(w, http.StatusUnauthorized, "invalid_api_key", "no public API keys are configured")
		return false
	}
	if slices.Contains(cfg.PublicAPIKeys, token) {
		return true
	}''')
          p.write_text(s)

          p = Path('app_test.go')
          s = p.read_text()
          duplicate = '\tif strings.TrimSpace(cfg.AdminToken) == "" { cfg.AdminToken = "test-admin-key" }\n\tif strings.TrimSpace(cfg.AdminToken) == "" { cfg.AdminToken = "test-admin-key" }\n'
          s = s.replace(duplicate, '\tif strings.TrimSpace(cfg.AdminToken) == "" { cfg.AdminToken = "test-admin-key" }\n')
          p.write_text(s)

          Path('.github/workflows/patch-scoped-bridge.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "rooter-patchbot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep auth sentinels internal"
          git push origin HEAD:agent/scoped-api-keys
