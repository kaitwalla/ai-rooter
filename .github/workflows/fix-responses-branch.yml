name: Patch Responses branch

on:
  push:
    branches:
      - agent/responses-embeddings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply branch patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('responses_compat.go')
          s = p.read_text()
          old = '\tclone.URL = clone.URL.Clone()\n'
          new = '\turlCopy := *clone.URL\n\tclone.URL = &urlCopy\n'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add responses_compat.go
          git commit -m 'fix Responses request URL cloning'
          git push
