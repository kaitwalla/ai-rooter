name: Patch Ollama Responses route

on:
  push:
    branches:
      - agent/responses-embeddings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Responses route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ollama.go')
          s = p.read_text()
          old = '\tcase "/v1/chat/completions":\n\t\ta.handleOllamaChat(w, r, provider, publicModel, body)\n'
          new = old + '\tcase "/v1/responses":\n\t\ta.proxyOllamaResponses(w, r, provider, body)\n'
          if '\tcase "/v1/responses":\n' not in s:
              if old not in s:
                  raise SystemExit('chat route anchor not found')
              p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ollama.go
          git commit -m 'route Ollama Responses through OpenAI endpoint'
          git push
