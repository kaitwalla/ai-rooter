[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avo-harness"
version = "0.1.0"
description = "Unofficial long-horizon agent orchestration inspired by NVIDIA AVO"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AVO Harness contributors"}]
dependencies = []

[project.optional-dependencies]
nemo = ["nemo-fabric>=0.2,<0.3"]
dev = ["pytest>=8"]

[project.scripts]
avo-harness = "avo_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
